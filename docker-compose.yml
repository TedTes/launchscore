services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: launchscore
      POSTGRES_PASSWORD: launchscore
      POSTGRES_DB: launchscore
    ports:
      - "5432:5432"
    volumes:
      - launchscore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launchscore"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  launchscore-postgres:
